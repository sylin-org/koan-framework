name: Release package train

on:
  push:
    tags:
      - "v*"

concurrency:
  group: koan-nuget-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  certify:
    name: Build and certify packages
    runs-on: ubuntu-24.04
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify release tag eligibility and version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            throw 'Package publication requires a Git tag.'
          }
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Release tag '$env:GITHUB_REF_NAME' must have the form vX.Y.Z."
          }

          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/dev.' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/dev
          if ($LASTEXITCODE -ne 0) {
            throw "Tagged commit '$env:GITHUB_SHA' is not an ancestor of origin/dev."
          }

          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'Local tool restore failed.' }
          $computed = (dotnet nbgv get-version -v SimpleVersion).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($computed)) {
            throw 'Nerdbank.GitVersioning did not produce a package version.'
          }
          if ($env:GITHUB_REF_NAME -ne "v$computed") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match repository version 'v$computed'."
          }
          "package-version=$computed" >> $env:GITHUB_OUTPUT

      - name: Build the release solution
        run: dotnet build Koan.sln --configuration Release --property:PublicRelease=true --nologo

      - name: Compile the package inventory
        run: dotnet run --project tools/Koan.Packaging -- product-surface --output artifacts/release/product-surface.json

      - name: Build the template release input
        shell: pwsh
        run: |
          dotnet build templates/Sylin.Koan.Templates.csproj --configuration Release --property:PublicRelease=true --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Template build failed.' }

      - name: Pack the complete train once
        shell: pwsh
        run: |
          ./scripts/pack-package-train.ps1 `
            -ProductSurfacePath artifacts/release/product-surface.json `
            -OutputDirectory artifacts/release/feed `
            -ExpectedVersion '${{ steps.version.outputs.package-version }}' `
            -Configuration Release

      - name: Stage the checked publisher
        shell: pwsh
        run: Copy-Item scripts/publish-package-train.ps1 artifacts/release/publish-package-train.ps1

      - name: Verify the staged feed through a clean consumer
        shell: pwsh
        run: |
          ./scripts/verify-package-feed.ps1 `
            -ProductSurfacePath artifacts/release/product-surface.json `
            -FeedDirectory artifacts/release/feed `
            -ExpectedVersion '${{ steps.version.outputs.package-version }}' `
            -HashManifestPath artifacts/release/SHA256SUMS

      - name: Upload the certified release bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koan-package-train-${{ steps.version.outputs.package-version }}
          path: artifacts/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish certified packages
    needs: certify
    runs-on: ubuntu-24.04

    # If a push is interrupted, rerun only this failed job. GitHub reuses the successful
    # certify artifact, whose hashes are verified again before publication resumes.

    steps:
      - name: Download the certified release bytes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: koan-package-train-${{ needs.certify.outputs.package-version }}
          path: artifacts/release

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Verify artifact hashes
        shell: pwsh
        working-directory: artifacts/release
        run: |
          $manifest = Get-Content SHA256SUMS
          if ($manifest.Count -eq 0) { throw 'SHA256SUMS contains no package entries.' }

          $listed = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          foreach ($line in $manifest) {
            if ($line -notmatch '^(?<hash>[A-F0-9]{64})  (?<path>.+)$') {
              throw "Invalid SHA256SUMS line: '$line'."
            }
            $relative = $Matches.path.Replace('/', [IO.Path]::DirectorySeparatorChar)
            if ([IO.Path]::IsPathRooted($relative) -or $relative.Split([IO.Path]::DirectorySeparatorChar) -contains '..') {
              throw "Unsafe SHA256SUMS path: '$relative'."
            }
            if (-not $listed.Add($relative)) { throw "Duplicate SHA256SUMS path: '$relative'." }
            if (-not (Test-Path -LiteralPath $relative -PathType Leaf)) {
              throw "Missing staged package '$relative'."
            }
            $actual = (Get-FileHash -LiteralPath $relative -Algorithm SHA256).Hash
            if ($actual -ne $Matches.hash) { throw "Hash mismatch for '$relative'." }
          }

          $staged = @(
            Get-Item product-surface.json
            Get-Item publish-package-train.ps1
            Get-ChildItem feed -File | Where-Object { $_.Name -match '\.(s)?nupkg$' }
          )
          if ($staged.Count -ne $listed.Count) {
            throw "Staged package count $($staged.Count) differs from manifest count $($listed.Count)."
          }
          foreach ($package in $staged) {
            $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $package.FullName)
            if (-not $listed.Contains($relative)) { throw "Unlisted staged package '$relative'." }
          }

      - name: Publish the certified package train
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          & ./artifacts/release/publish-package-train.ps1 `
            -ProductSurfacePath artifacts/release/product-surface.json `
            -FeedDirectory artifacts/release/feed `
            -ExpectedVersion '${{ needs.certify.outputs.package-version }}'
