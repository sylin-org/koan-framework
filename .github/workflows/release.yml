name: Release

# `main` is the published state. Merging `dev` into `main` releases whatever changed since the last
# release, and nothing else: each package owns its version, so a merge that changed no packable
# source produces an empty plan and publishes nothing.

on:
  push:
    branches: [main]

concurrency:
  group: koan-nuget-publication
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # the SignPath action reads job details + downloads the artifact (docs.signpath.io/trusted-build-systems/github)

jobs:
  certify:
    name: Plan, pack, and prove
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Require a fast-forward of dev
        shell: pwsh
        run: |
          # Package versions come from commit height, so main must contain exactly dev's commits.
          # A merge commit on main is not reachable from dev and would compute different heights for
          # the same sources, so this one check enforces the fast-forward rule.
          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/dev.' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/dev
          if ($LASTEXITCODE -ne 0) {
            throw "Commit '$env:GITHUB_SHA' is not reachable from origin/dev. Fast-forward main from dev."
          }

      - name: Restore local tools
        run: dotnet tool restore

      - name: Compile the package inventory
        run: dotnet run --project tools/Koan.Packaging -- inventory --output artifacts/release/inventory.json

      - name: Plan the release
        shell: pwsh
        run: |
          ./scripts/plan-release.ps1 `
            -InventoryPath artifacts/release/inventory.json `
            -OutputPath artifacts/release/release-plan.json

      - name: Pack what changed
        shell: pwsh
        run: |
          ./scripts/pack-release.ps1 `
            -PlanPath artifacts/release/release-plan.json `
            -OutputDirectory artifacts/release/feed `
            -Configuration Release `
            -PublisherSigningEnabled ('${{ vars.SIGNPATH_ENABLED }}' -eq 'true')

      - name: Record release plan state
        id: release-plan
        shell: pwsh
        run: |
          $plan = Get-Content -LiteralPath artifacts/release/release-plan.json -Raw | ConvertFrom-Json
          $count = @($plan.packages | Where-Object { $_.publish }).Count
          "package-count=$count" >> $env:GITHUB_OUTPUT
          Write-Host "RELEASE|PACKAGES|$count"

      - name: Require complete SignPath configuration
        if: steps.release-plan.outputs.package-count != '0' && vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "SIGNPATH_ENABLED is true but '$name' is not configured."
            }
          }

      - name: Upload unsigned packages for SignPath
        if: steps.release-plan.outputs.package-count != '0' && vars.SIGNPATH_ENABLED == 'true'
        id: upload-unsigned-packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koan-signing-input-${{ github.sha }}
          overwrite: true   # re-running failed jobs must replace, not collide (actions/upload-artifact#769)
          path: artifacts/release/feed/*.nupkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Submit the SignPath signing request
        if: steps.release-plan.outputs.package-count != '0' && vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@a790881fc89970675894221b0be3bb12a87eb391 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-packages.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21600   # manual approval is part of the policy; give it a working day
          output-artifact-directory: artifacts/release/signpath-output

      - name: Finalize signed packages
        if: steps.release-plan.outputs.package-count != '0' && vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          ./scripts/finalize-signpath-release.ps1 `
            -PlanPath artifacts/release/release-plan.json `
            -FeedDirectory artifacts/release/feed `
            -SignedDirectory artifacts/release/signpath-output

      - name: Record code signing state
        shell: pwsh
        run: |
          $count = [int]'${{ steps.release-plan.outputs.package-count }}'
          $enabled = '${{ vars.SIGNPATH_ENABLED }}' -eq 'true'
          $status = [ordered]@{
            policy = 'https://github.com/sylin-org/koan-framework/blob/main/CODE_SIGNING_POLICY.md'
            enabled = $enabled
            signed = $enabled -and $count -gt 0
            packageCount = $count
          }
          $status | ConvertTo-Json | Set-Content -LiteralPath artifacts/release/code-signing.json -Encoding utf8

      - name: Prove the release through a package-only application
        shell: pwsh
        run: |
          ./scripts/verify-release.ps1 `
            -PlanPath artifacts/release/release-plan.json `
            -FeedDirectory artifacts/release/feed

      - name: Upload the certified release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koan-release-${{ github.sha }}
          path: artifacts/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish
    needs: certify
    runs-on: ubuntu-24.04

    # A separate job so the credential never exists in the environment that built the packages.
    # If a push is interrupted, rerun this job: --skip-duplicate makes whatever already landed a
    # no-op, and no version is ever republished.

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download the certified release
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: koan-release-${{ github.sha }}
          path: artifacts/release

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish the planned packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          ./scripts/publish-release.ps1 `
            -PlanPath artifacts/release/release-plan.json `
            -FeedDirectory artifacts/release/feed
