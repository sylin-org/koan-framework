name: skills-verify

# Compiles the koan skill's claims against the packages published to nuget.org. This needs network
# access and a real restore, so it runs on a schedule rather than in the per-PR gate -- and it
# catches drift the PR gate structurally cannot: an identifier that no longer resolves, or an API
# that changed under guidance which still pattern-matches as correct.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      packageVersion:
        description: Published Koan package version range to verify against
        required: false
        default: '1.*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Pinned recipe links are checked with `git cat-file -e v1.0.0:<path>`, so the release tag
          # must be present. A default shallow checkout fetches no tags, which makes every pinned
          # link report as unresolvable regardless of whether the file exists.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Verify skill claims against published packages
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.packageVersion }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '1.*' }
          ./scripts/skills-verify.ps1 -PackageVersion $version
          if ($LASTEXITCODE -ne 0) { throw 'Skill verification failed.' }
